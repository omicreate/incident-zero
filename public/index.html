  /* 登場人物 */

  .cast-h { font-size: 14px; color: var(--dim); margin: 22px 0 8px; font-weight: 600; letter-spacing: .06em; }
  .cast { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }

  header.top .hbtns { display: flex; gap: 6px; margin-left: auto; margin-right: 12px; }

  .ghost { background: transparent; border: 1px solid #3a4552; color: var(--ink); border-radius: 8px; padding: 10px 16px; font: inherit; cursor: pointer; }
  .ghost:hover, .ghost:focus-visible { border-color: var(--accent); outline: none; }
  .startrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 6px; }

  .guide ol { margin: 6px 0 10px; padding-left: 1.3em; }
  button.ch.small { width: auto; display: inline-block; padding: 6px 14px; }

  .notes-card summary::after { content: " ▾"; color: var(--dim); font-size: 12px; }

  #tip b { display: block; color: var(--accent); }

  /* 結果の共有と感想 */
  .sharerow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .fb .q { font-size: 14px; font-weight: 600; margin: 12px 0 6px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .segb { min-width: 44px; background: var(--panel2); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .segb.on { border-color: var(--accent); background: #12263a; }
  .fb select, .fb textarea, dialog textarea { width: 100%; background: #0b0f14; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
  dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; max-width: 480px; width: calc(100% - 32px); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h3 { margin: 0 0 6px; }

  /* 院内ネットの地図 */
  .netmap svg { width: 100%; height: auto; display: block; }
  .netmap .legend { font-size: 12px; color: var(--dim); margin-top: 4px; }
</style>

<body>
<div class="wrap" id="app"></div>

<script>
"use strict";

/* ==== ENGINE START ====
   画面に触れない「ゲームの仕組み」。tools/sim.mjs がここだけを取り出して、自動で何百回も遊ばせる。
   時刻 t は 0:00 からの分。0:24 に始まり、8:30(510分)の外来で終わる。 */

const START = 24, END = 510;
const METER = { spread: "広がり", patient: "患者への影響", trust: "信頼", evidence: "証拠" };
// 数字が増えると悪いもの
const WORSE_UP = { spread: true, patient: true };

// 毎回ランダムに決まる「今夜の答え」
const ANS = {
  entry: { vpn: "VPN機器の古い弱点", vendor: "業者の保守用の接続（どの病院も同じパスワード）", mail: "職員に届いた偽の添付メール" },
  backdoor: { admin: "新しく作られた管理者ID", tool: "サーバに常駐する遠隔操作の道具", task: "毎朝6時に動く予約された処理" },
  backup: { lost: "院内の控えは、事件の前から暗号化されていた", online: "院内の控えは無事だった（院内ネットにつながったまま）", offline: "院内の控えは暗号化。金庫に1週間前の外付けディスク" },
  exfil: { yes: "あり（約40GB）", no: "なし（盗んだというのは、はったり）" },
};

function clock(t) { const h = Math.floor(t / 60), m = t % 60; return "AM " + h + ":" + String(m).padStart(2, "0"); }
function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
function clamp(v) { return Math.max(0, Math.min(100, v)); }
function add(g, k, v) { g.m[k] = clamp(g.m[k] + v); }
function loseEvidence(g, v) { if (!g.preserved) add(g, "evidence", -v); }
function note(g, text) { g.notes.push({ t: g.t, text }); }
// 対応チームに電話していれば、手順を教わりながらなので調べものが早い
function inv(g, base) { return g.ir.calledAt !== null ? Math.round(base * 0.75) : base; }

function newGame(rng) {
  const g = {
    t: START,
    hidden: {
      entry: pick(rng, ["vpn", "vendor", "mail"]),
      backdoor: pick(rng, ["admin", "tool", "task"]),
      backup: pick(rng, ["lost", "online", "offline"]),
      exfil: rng() < 0.5 ? "yes" : "no",
    },
    m: { spread: 10, patient: 0, trust: 50, evidence: 80 },
    net: "open", // open: 全部つながっている / outsideCut: 外だけ切った / segmented: 部署ごとに分けた / off: 全部抜いた
    serversOff: false, backupDetached: false, backupLostAt: null, backupKnown: null, backupSeen: null,
    paperAt: null, paperReady: false, paperReadyAt: null,
    ir: { calledAt: null, arriveAt: null, onsite: false },
    director: false, police: false, pref: false, staffNotified: false, neighbor: false, preserved: false,
    closed: { vpn: false, vendor: false, mail: false },
    found: { admin: false, tool: false, task: false, mail: false },
    removed: { admin: false, tool: false, task: false },
    refReady: false, paidRecovery: false, paidRansom: false, egressKnown: false,
    identified: false, // 侵入口を「使われた跡」で見抜いたか(塞いだだけとは別)
    press: null, reconnect: null, outpatient: null,
    used: {}, notes: [], timeline: [], queue: [], fired: {}, notices: [],
    pending: null, pendingAt: null, ended: false, result: null,
  };
  if (g.hidden.backup === "lost") g.backupLostAt = 0;
  g.last = {
    h: "カルテが、ぜんぶ開かない",
    lines: ["[病棟] 電子カルテ: 応答なし", "[事務] プリンタ: 英語の文書を印刷し続けている"],
    text: "夜中の0時24分。三好看護師長から内線。「電子カルテが真っ赤な英語の画面になって、何も出せません。プリンタも止まらないんです」。\n\nプリンタから出てくる紙には、こうある。『おまえたちのファイルはすべて暗号化し、盗んだ。元に戻したければ、ここへ連絡しろ』。\n\nあなたはこの病院のシステムを、一人で見てきた。朝8時30分には外来が始まる。",
    t0: START, t1: START, before: { ...g.m }, after: { ...g.m }, notices: [], place: "office", prop: { kind: "paper" },
  };
  return g;
}

/* ---- 時間を進める(1分ずつ) ---- */
function tick(g, min) {
  for (let i = 0; i < min && g.t < END; i++) {
    g.t++;
    let rate = { open: 14, outsideCut: 8, segmented: 2, off: 0 }[g.net];
    if (g.serversOff) rate *= 0.35;
    g.m.spread = clamp(g.m.spread + rate / 60);
    // 院内ネットにつながったままの控えは、広がりが35%を超えると知らないうちにやられる
    if (g.hidden.backup === "online" && g.backupLostAt === null && !g.backupDetached &&
        g.m.spread >= 35 && (g.net === "open" || g.net === "outsideCut")) g.backupLostAt = g.t;
    if (g.paperAt !== null && !g.paperReady && g.t >= g.paperAt) {
      g.paperReady = true; g.paperReadyAt = g.t;
      g.notices.push("紙での運用が整った(三好看護師長)"); note(g, "紙での運用が整った");
    }
    let p = g.paperReady ? 1 : 5;
    if (g.net === "off") p += g.paperReady ? 1 : 4; // 院内の電話と検査機器も止まる
    if (g.refReady) p *= 0.5;
    g.m.patient = clamp(g.m.patient + p / 60);
    if (g.ir.arriveAt !== null && !g.ir.onsite && g.t >= g.ir.arriveAt) { g.ir.onsite = true; g.queue.push({ id: "ir_arrive", t: g.t }); }
    for (const ev of EVENTS) {
      if (ev.at === undefined || g.fired[ev.id] || g.t < ev.at) continue;
      g.fired[ev.id] = true;
      if (!ev.when || ev.when(g)) g.queue.push({ id: ev.id, t: g.t });
      else if (ev.onSkip) ev.onSkip(g);
    }
  }
}

/* ---- できること ---- */
const ACTIONS = [
  // 止める
  { id: "cut_outside", group: "止める", label: "外との出入口(インターネットとVPN)を切る", note: "外から新しい命令が届かなくなる。院内の広がりは続く",
    cost: () => 10, need: (g) => g.net === "open" ? null : "もう切ってある",
    run(g) { g.net = "outsideCut";

  g.result = { score, rank, title, weeks, epi, entryOK, doorOK, backupSaved, reinfect, parts, minus };
  g.ended = true;
  g.pending = null;
}

/* --- 音(外部ファイルなし。その場で合成する) --- */
const SND = {
  ctx: null, amb: null,
  ensure() {
    if (!STATS.sound) return null;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === "suspended") this.ctx.resume();
    } catch (e) { return null; }
    return this.ctx;
  },
  tone(f, start, dur, vol, type) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g).connect(c.destination); o.start(start); o.stop(start + dur + 0.05);
  },
  noise(start, dur, vol, freq, q) {
    const c = this.ctx, len = Math.ceil(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
    g.gain.setValueAtTime(0.0001, start); g.gain.exponentialRampToValueAtTime(vol, start + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    s.connect(f).connect(g).connect(c.destination); s.start(start); s.stop(start + dur + 0.02);
  },
  // 夜の事務室: 空調のさーっという音と、電源の低いうなり(西日本は60Hz)
  ambientStart() {
    const c = this.ensure();
    if (!c || this.amb) return;
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const src = c.createBufferSource(), lp = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; src.loop = true; lp.type = "lowpass"; lp.frequency.value = 500;
    g.gain.setValueAtTime(0.0001, c.currentTime); g.gain.exponentialRampToValueAtTime(0.05, c.currentTime + 2);
    src.connect(lp).connect(g).connect(c.destination); src.start();
    const hum = c.createOscillator(), hg = c.createGain();
    hum.frequency.value = 60; hg.gain.value = 0.004; hum.connect(hg).connect(c.destination); hum.start();
    this.amb = { src, g, hum };
  },
  ambientStop() {
    if (!this.amb || !this.ctx) return;
    const t = this.ctx.currentTime;
    try { this.amb.g.gain.exponentialRampToValueAtTime(0.0001, t + 1); this.amb.src.stop(t + 1.1); this.amb.hum.stop(t + 0.2); } catch (e) {}
    this.amb = null;
  },
  // 日本の電話の呼出音: 400Hz を 16Hz で揺らし、1秒鳴って2秒休む。2回
  ring() {
    const c = this.ensure();
    if (!c) return;
    const t0 = c.currentTime + 0.05;
    for (let k = 0; k < 2; k++) {
      const s = t0 + k * 3, o = c.createOscillator(), am = c.createGain(), lfo = c.createOscillator(), depth = c.createGain(), env = c.createGain();
      o.frequency.value = 400; lfo.type = "square"; lfo.frequency.value = 16; depth.gain.value = 0.5; am.gain.value = 0.5;
      lfo.connect(depth).connect(am.gain);
      env.gain.setValueAtTime(0.0001, s); env.gain.exponentialRampToValueAtTime(0.06, s + 0.02);
      env.gain.setValueAtTime(0.06, s + 0.97); env.gain.exponentialRampToValueAtTime(0.0001, s + 1);
      o.connect(am).connect(env).connect(c.destination);
      o.start(s); lfo.start(s); o.stop(s + 1.05); lfo.stop(s + 1.05);
    }
  },
  printer() {
    const c = this.ensure();
    if (!c) return;
    const t = c.currentTime + 0.05;
    for (let i = 0; i < 16; i++) { this.noise(t + i * 0.17, 0.12, 0.05, 2200, 1.5); this.noise(t + i * 0.17, 0.05, 0.05, 180, 0.8); }
  },
  chime(kind) {
    const c = this.ensure();
    if (!c) return;
    const t = c.currentTime + 0.02, seq = kind === "bad" ? [196, 147] : kind === "msg" ? [880, 1175] : [660, 880];
    seq.forEach((f, i) => this.tone(f, t + i * 0.14, 0.4, 0.04));
  },
  tick() { const c = this.ensure(); if (c) this.tone(1400, c.currentTime + 0.01, 0.05, 0.012, "square"); },
  dawn(good) {
    const c = this.ensure();
    if (!c) return;
    const t = c.currentTime + 0.1;
    (good ? [392, 494, 587, 784] : [147, 175, 208]).forEach((f, i) => this.tone(f, t + i * 0.18, 2.6, 0.03));
  },
};
// 出来事が出たときの音

    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x + '" y2="' + (r === 0 ? y + 11 : y - 11) + '" ' + (detached ? 'stroke="#2a313a" stroke-dasharray="2 5"' : linkStyle) + ' stroke-width="1.2"/>';
    let fill = "#10241b", stroke = "#3fcf8e", label = NET_LABEL[id], tc = "#cfe9dc";
    if (isBk) {
      const seen = g.backupSeen;
      if (!seen) { fill = "#141920"; stroke = "#5d6875"; label = "控え ?"; tc = "#8d97a4"; }
      else if (seen === "lost") { fill = "#2a1114"; stroke = "#ff6f6f"; tc = "#ffc9c9"; }
      else if (seen === "old") { fill = "#2a2210"; stroke = "#f2b84b"; label = "控え(金庫)"; tc = "#f6dca6"; }

    else if (hit.has(id)) { fill = "#2a1114"; stroke = "#ff6f6f"; tc = "#ffc9c9"; }
    svg += '<rect x="' + (x - 22) + '" y="' + (y - 11) + '" width="44" height="22" rx="5" fill="' + fill + '" stroke="' + stroke + '"/>' +
      '<text x="' + x + '" y="' + (y + 4) + '" font-size="' + (label.length > 4 ? 8.5 : 10) + '" fill="' + tc + '" text-anchor="middle">' + label + "</text>";
  }));

function shareText(g) { return "さくら町立病院の一夜、ランク" + g.result.rank + "「" + g.result.title + "」でした。" + shareLine(g) + " #インシデントゼロ"; }
function loadImg(src) { return new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }); }
function wrapText(x, text, left, top, width, lh) {
  let line = "", y = top;
  for (const ch of text) {
    if (x.measureText(line + ch).width > width && line) { x.fillText(line, left, y); line = ch; y += lh; } else line += ch;
  }
  if (line) x.fillText(line, left, y);
}
async function makeCard(g, withPhoto) {
  const c = document.createElement("canvas");
  c.width = 1200; c.height = 630;
  const x = c.getContext("2d"), R = g.result;
  const F = '"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif';
  x.fillStyle = "#0b0d10"; x.fillRect(0, 0, 1200, 630);
  if (withPhoto) {
    const im = await loadImg("img/exterior.jpg");
    if (im) { const r = Math.max(1200 / im.width, 630 / im.height), w = im.width * r, h = im.height * r; x.drawImage(im, (1200 - w) / 2, (630 - h) / 2, w, h); }
  }
  const gr = x.createLinearGradient(0, 0, 1200, 0);
  gr.addColorStop(0, "rgba(5,7,10,.94)"); gr.addColorStop(0.6, "rgba(5,7,10,.6)"); gr.addColorStop(1, "rgba(5,7,10,.25)");
  x.fillStyle = gr; x.fillRect(0, 0, 1200, 630);
  x.fillStyle = "#f2b84b"; x.font = "600 26px " + F; x.fillText("インシデント・ゼロ", 64, 92);
  x.fillStyle = "#e7eaee"; x.font = "800 58px " + F; x.fillText("さくら町立病院の一夜", 64, 168);
  x.strokeStyle = "#62aefc"; x.lineWidth = 4; x.strokeRect(64, 216, 150, 150);
  x.font = "800 110px ui-monospace,Consolas,monospace"; x.textAlign = "center"; x.fillText(R.rank, 139, 332); x.textAlign = "left";
  x.font = "700 44px " + F; x.fillText(R.title, 250, 268);
  x.fillStyle = "#b9c4d0"; x.font = "500 28px " + F; wrapText(x, shareLine(g), 250, 318, 860, 40);
  x.fillStyle = "#8d97a4"; x.font = "500 26px " + F; x.fillText("点数 " + R.score + " / 100", 250, 410);
  x.fillStyle = "#e7eaee"; x.font = "600 30px " + F; x.fillText("夜中0時24分、カルテが全部開かなくなった。あなたなら、どうする？", 64, 520);
  x.fillStyle = "#8d97a4"; x.font = "500 22px " + F; x.fillText(CONFIG.url ? CONFIG.url.replace(/^https?:\/\//, "") : "omicreate", 64, 580);
  return c;
}
// ファイルを直接開いたときは写真入りの画像を書き出せないので、写真なしで作り直す
async function cardBlob(g) {
  for (const photo of [true, false]) {
    try {
      const c = await makeCard(g, photo);
      const b = await new Promise((r) => c.toBlob(r, "image/png"));
      if (b) return b;
    } catch (e) { /* 次は写真なしで */ }
  }
  return null;
}
async function shareAction(cmd) {
  const text = shareText(G), url = CONFIG.url;
  if (cmd === "share-x") window.open("https://x.com/intent/post?text=" + encodeURIComponent(text) + (url ? "&url=" + encodeURIComponent(url) : ""), "_blank", "noopener");
  else if (cmd === "share-threads") window.open("https://www.threads.net/intent/post?text=" + encodeURIComponent(text + (url ? " " + url : "")), "_blank", "noopener");
  else if (cmd === "share-save" || cmd === "share-native") {
    const blob = await cardBlob(G);
    if (!blob) return;
    const file = new File([blob], "incident-zero-result.png", { type: "image/png" });
    if (cmd === "share-native" && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], text: text + (url ? " " + url : "") }); } catch (e) { /* 閉じただけ */ }
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
}

    "<h3>あなたの夜</h3><ol>" + tl + "</ol>" +
    "<h3>実際の事件では(半田病院・2021年)</h3><ul>" +
    "<li>2021年10月31日の未明、徳島県のつるぎ町立半田病院で、プリンタから犯行声明が大量に印刷され、電子カルテが使えなくなった。</li>" +
    "<li>侵入口は、外から院内に入るためのVPN機器の、直されていない弱点とされる。</li>" +
    "<li>バックアップも同じネットにつながっていて、一緒に暗号化された。</li>" +
    "<li>病院は身代金を払わず、紙のカルテで入院患者の診療を続けた。新しい患者や救急の受け入れを止め、通常の診療に戻ったのは約2か月後(2022年1月)。</li>" +
    '</ul><p class="fine">出典: <a href="https://scan.netsecurity.ne.jp/article/2022/06/28/47803.html" target="_blank" rel="noopener noreferrer">有識者会議の調査報告書の公開を伝える報道(ScanNetSecurity)</a>。このゲームの病院・人物・会社・出来事の細部は架空。</p></div>' +
    '<p><button class="primary" data-cmd="start">もう一度(答えは変わります)</button> <button class="ghost" data-cmd="title">タイトルへ</button></p>';
}

/* --- 進行 --- */
function newRun() {
  G = newGame(Math.random);
  G.sid = Math.random().toString(36).slice(2, 10);
  G.startedAt = Date.now();
  STATS.plays++; saveStats();
  FB = {}; lastEventShown = null;
  send("start", { clock: clock(G.t) });
  SND.ambientStart(); SND.printer();
}
function resumeRun() {
  const s = savedGame();
  if (!s) return newRun();
  G = s; FB = {}; lastEventShown = G.pending;
  send("resume", { clock: clock(G.t), steps: G.timeline.length });
  SND.ambientStart();
}
function onEnded() {
  if (G.endLogged) return;
  G.endLogged = true;
  const R = G.result, H = G.hidden;
  STATS.finished++;
  if (!STATS.best || R.score > STATS.best.score) STATS.best = { rank: R.rank, score: R.score };
  saveStats(); store(SAVE_KEY, null);
  send("end", { clock: clock(G.t), steps: G.timeline.length, rank: R.rank, score: R.score, ending: R.title, answers: [H.entry, H.backdoor, H.backup, H.exfil].join("/"), elapsed: elapsedSec() });
  SND.ambientStop(); SND.dawn(R.rank === "S" || R.rank === "A");
}
function render() {
  hideTip();
  if (!G) renderTitle();
  else if (G.ended) { onEnded(); renderEnd(); }
  else renderPlay();
}
function toTop() {
  // スマホでは場面の絵から見せる(時計と数字は一つ上)
  const st = isNarrow() ? document.querySelector(".g-stage") : null;
  window.scrollTo(0, st ? Math.max(0, st.getBoundingClientRect().top + window.scrollY - 8) : 0);
}

app.addEventListener("click", (e) => {
  const term = e.target.closest("button.term");
  if (term) { showTip(term); return; }
  hideTip();
  const b = e.target.closest("button");
  if (!b || b.disabled) return;
  const cmd = b.dataset.cmd;
  if (cmd === "sound") {
    STATS.sound = !STATS.sound; saveStats();
    if (!STATS.sound) SND.ambientStop(); else if (G && !G.ended) SND.ambientStart();
    document.querySelectorAll('[data-cmd="sound"]').forEach((x) => { x.textContent = "音 " + (STATS.sound ? "オン" : "オフ"); x.setAttribute("aria-pressed", STATS.sound); });
    return;
  }
  if (cmd === "telemetry") { STATS.telemetry = !STATS.telemetry; saveStats(); renderTitle(); return; }
  if (cmd === "comment") { openComment(); return; }
  if (cmd === "guide-ok") { STATS.guideSeen = true; saveStats(); const gd = b.closest(".guide"); if (gd) gd.remove(); return; }
  if (cmd === "fb-pick") {
    FB[b.dataset.q] = b.dataset.v;
    b.parentElement.querySelectorAll(".segb").forEach((x) => { const on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-pressed", on); });
    return;
  }
  if (cmd === "fb-send") {
    FB.stuck = document.getElementById("fb-stuck").value;
    FB.comment = document.getElementById("fb-text").value.trim();
    if (!FB.fun && !FB.comment) { document.getElementById("fb-msg").textContent = "面白さか、ひとことを入れてください"; return; }
    send("feedback", { fun: FB.fun, again: FB.again, stuck: FB.stuck, comment: FB.comment, rank: G.result.rank, score: G.result.score, clock: clock(G.t), steps: G.timeline.length });
    FB.sent = true;
    document.getElementById("fb").outerHTML = feedbackHTML();
    return;
  }
  if (cmd && cmd.startsWith("share-")) { shareAction(cmd); return; }
  if (cmd === "title") { G = null; SND.ambientStop(); render(); window.scrollTo(0, 0); return; }
  if (cmd === "start") newRun();
  else if (cmd === "resume") resumeRun();
  else if (b.dataset.act) {
    if (!STATS.guideSeen) { STATS.guideSeen = true; saveStats(); }
    SND.tick(); doAction(G, b.dataset.act);
  } else if (b.dataset.choice !== undefined) { SND.tick(); chooseEvent(G, Number(b.dataset.choice)); }
  else return;
  trackProgress();
  saveGame();
  render();
  eventSound();
  if (G && G.ended) window.scrollTo(0, 0); else toTop();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideTip(); });
window.addEventListener("scroll", hideTip, { passive: true });

render();
</script>
</body>
</html>
